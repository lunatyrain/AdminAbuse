# AdminAbuse - Luna's Vampire Bite

# Red chat message the bitten player sees.
message: "You have been bitten by Luna"

# How many /lunabite gives when you do not type an amount (1-99).
default-amount: 1

# Knockback of a bite (a normal hit is about 0.4).
knockback: 0.45

# true = the bite works even where another plugin blocks the attack (spawn protection, PvP-off regions, combat plugins).
ignore-protection: true

# true = the person swinging gets grey chat lines saying what the bite did (or why it did nothing).
# Toggle in-game with /lunabite debug
debug: false
